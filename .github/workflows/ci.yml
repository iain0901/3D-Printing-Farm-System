name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QC
        run: npm run qc

      - name: Upload production build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: ignore
          retention-days: 7

  compose-postgres:
    name: Compose PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAYERPILOT_DB_ADAPTER: postgres
      POSTGRES_DB: farmflow_ci
      POSTGRES_USER: farmflow_ci
      POSTGRES_PASSWORD: ci-postgres-password-please-change
      LAYERPILOT_ADMIN_EMAIL: owner@example.test
      LAYERPILOT_ADMIN_PASSWORD: ci-owner-password-please-change
      LAYERPILOT_DISABLE_DEFAULT_USERS: "true"
      LAYERPILOT_DISABLE_DEMO_LOGIN: "true"
      LAYERPILOT_METRICS_TOKEN: ci-metrics-token-for-compose-smoke-2026
      LAYERPILOT_WORKER_TOKEN: ci-worker-token-for-compose-smoke-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker compose build layerpilot

      - name: Start PostgreSQL and API
        run: docker compose up -d postgres layerpilot

      - name: Verify PostgreSQL and API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8797/api/readiness; then
              docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
