<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3DRFM 案件助手</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Noto Sans TC", sans-serif; color: #162235; background: #f7f8fa; }
      body { margin: 0; padding: 16px; } .card { padding: 14px; border: 1px solid #e4e8ef; border-radius: 10px; background: #fff; box-shadow: 0 2px 8px #1824320c; }
      h1 { font-size: 16px; margin: 0 0 12px; } dl { margin: 0; display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: 13px; }
      dt { color: #6a7280; } dd { margin: 0; overflow-wrap: anywhere; } .status { display: inline-block; border-radius: 999px; padding: 3px 8px; background: #edf4ff; color: #2057a5; }
      a { display: inline-block; margin-top: 14px; color: #fff; background: #246bce; border-radius: 6px; padding: 8px 10px; text-decoration: none; font-size: 13px; }
      .muted { color: #6a7280; font-size: 13px; line-height: 1.55; } .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main class="card"><p class="muted">正在讀取案件關聯…</p></main>
    <script>
      const panel = new URLSearchParams(location.search);
      const config = {
        apiBase: panel.get("apiBase") || "",
        panelSecret: panel.get("panelSecret") || "",
        accountId: panel.get("accountId") || "",
        conversationId: panel.get("conversationId") || ""
      };
      const root = document.querySelector("main");
      const text = (value) => String(value || "—").replace(/[&<>"']/g, (letter) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[letter]));
      if (!config.apiBase || !config.panelSecret || !config.accountId || !config.conversationId) {
        root.innerHTML = '<p class="muted">此元件需要 apiBase、panelSecret、accountId 與 conversationId。</p>';
      } else {
        const endpoint = `${config.apiBase.replace(/\/$/, "")}/api/integrations/chatwoot/context`;
        fetch(endpoint, {
          method: "POST",
          headers: { "content-type": "application/json", "x-chatwoot-panel-secret": config.panelSecret },
          body: JSON.stringify({ account_id: config.accountId, conversation_id: config.conversationId })
        })
          .then(async (response) => response.ok ? response.json() : Promise.reject(new Error((await response.json()).error || `HTTP ${response.status}`)))
          .then(({ case: record, ai }) => {
            if (!record) { root.innerHTML = '<p class="muted">此對話尚未關聯 3D 列印案件。</p>'; return; }
            root.innerHTML = `<h1>3DRFM 案件助手</h1><dl><dt>案件</dt><dd>${text(record.caseNo)} · ${text(record.project)}</dd><dt>狀態</dt><dd><span class="status">${text(record.status)}</span></dd><dt>AI 模式</dt><dd>${text(ai?.mode || "human")}</dd><dt>客戶</dt><dd>${text(record.customerSnapshot?.name)}</dd></dl><a href="${text(config.apiBase.replace(/\/$/, ""))}/#/cases?id=${encodeURIComponent(record.id)}" target="_blank" rel="noopener">在內部系統開啟案件</a>`;
          })
          .catch((error) => { root.innerHTML = `<p class="error">案件助手載入失敗：${text(error.message)}</p>`; });
      }
    </script>
  </body>
</html>
