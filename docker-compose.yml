name: layerpilot

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${LAYERPILOT_CONTAINER_NAME:-layerpilot}-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmflow}
      POSTGRES_USER: ${POSTGRES_USER:-farmflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - layerpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmflow} -d ${POSTGRES_DB:-farmflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  layerpilot:
    build:
      context: .
    image: layerpilot:local
    container_name: ${LAYERPILOT_CONTAINER_NAME:-layerpilot}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: production
      LAYERPILOT_HOST: 0.0.0.0
      LAYERPILOT_API_PORT: 8797
      LAYERPILOT_SERVE_STATIC: "true"
      LAYERPILOT_DB_PATH: /data/layerpilot.db.json
      LAYERPILOT_DB_ADAPTER: ${LAYERPILOT_DB_ADAPTER:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmflow}:${POSTGRES_PASSWORD:-change-this-database-password}@postgres:5432/${POSTGRES_DB:-farmflow}
      LAYERPILOT_POSTGRES_SCHEMA: ${LAYERPILOT_POSTGRES_SCHEMA:-public}
      LAYERPILOT_STORAGE_DIR: /data/storage
      LAYERPILOT_ADMIN_EMAIL: ${LAYERPILOT_ADMIN_EMAIL:-}
      LAYERPILOT_ADMIN_PASSWORD: ${LAYERPILOT_ADMIN_PASSWORD:-}
      LAYERPILOT_ADMIN_NAME: ${LAYERPILOT_ADMIN_NAME:-Production Owner}
      LAYERPILOT_WORKSPACE_NAME: ${LAYERPILOT_WORKSPACE_NAME:-3DSTU FarmFlow Production}
      LAYERPILOT_DISABLE_DEFAULT_USERS: ${LAYERPILOT_DISABLE_DEFAULT_USERS:-false}
      LAYERPILOT_DISABLE_DEMO_LOGIN: ${LAYERPILOT_DISABLE_DEMO_LOGIN:-false}
      LAYERPILOT_METRICS_TOKEN: ${LAYERPILOT_METRICS_TOKEN:-}
      LAYERPILOT_OPS_EMAIL: ${LAYERPILOT_OPS_EMAIL:-}
      LAYERPILOT_OPS_PASSWORD: ${LAYERPILOT_OPS_PASSWORD:-}
      LAYERPILOT_AUTO_BACKUP_ON_MIGRATE: ${LAYERPILOT_AUTO_BACKUP_ON_MIGRATE:-true}
      LAYERPILOT_WORKER_TOKEN: ${LAYERPILOT_WORKER_TOKEN:-change-this-worker-token}
      LAYERPILOT_OBJECT_STORAGE_PROVIDER: ${LAYERPILOT_OBJECT_STORAGE_PROVIDER:-local}
      LAYERPILOT_S3_BUCKET: ${LAYERPILOT_S3_BUCKET:-}
      LAYERPILOT_S3_REGION: ${LAYERPILOT_S3_REGION:-us-east-1}
      LAYERPILOT_S3_ENDPOINT: ${LAYERPILOT_S3_ENDPOINT:-}
      LAYERPILOT_S3_PREFIX: ${LAYERPILOT_S3_PREFIX:-layerpilot}
      LAYERPILOT_S3_FORCE_PATH_STYLE: ${LAYERPILOT_S3_FORCE_PATH_STYLE:-false}
      LAYERPILOT_S3_ACCESS_KEY_ID: ${LAYERPILOT_S3_ACCESS_KEY_ID:-}
      LAYERPILOT_S3_SECRET_ACCESS_KEY: ${LAYERPILOT_S3_SECRET_ACCESS_KEY:-}
      LAYERPILOT_MQTT_URL: ${LAYERPILOT_MQTT_URL:-}
      LAYERPILOT_MQTT_TOPIC_PREFIX: ${LAYERPILOT_MQTT_TOPIC_PREFIX:-layerpilot}
      LAYERPILOT_MQTT_USERNAME: ${LAYERPILOT_MQTT_USERNAME:-}
      LAYERPILOT_MQTT_PASSWORD: ${LAYERPILOT_MQTT_PASSWORD:-}
      LAYERPILOT_MQTT_QOS: ${LAYERPILOT_MQTT_QOS:-0}
      LAYERPILOT_MQTT_RETAIN: ${LAYERPILOT_MQTT_RETAIN:-false}
      LAYERPILOT_SLICER_CMD: ${LAYERPILOT_SLICER_CMD:-}
      LAYERPILOT_SLICER_ARGS: ${LAYERPILOT_SLICER_ARGS:-}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:-}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
      CHATWOOT_PANEL_SECRET: ${CHATWOOT_PANEL_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DEFAULT_MODE: ${AI_DEFAULT_MODE:-hybrid}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.78}
      LAYERPILOT_ENABLE_INTERNAL_TELEMETRY: "false"
      LAYERPILOT_ENABLE_INTERNAL_BRIDGE_POLLING: "false"
    ports:
      - "${LAYERPILOT_BIND_ADDRESS:-127.0.0.1}:${LAYERPILOT_HOST_PORT:-8797}:8797"
    volumes:
      - layerpilot-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port=process.env.LAYERPILOT_API_PORT||8797; fetch('http://127.0.0.1:'+port+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  layerpilot-worker:
    image: layerpilot:local
    container_name: ${LAYERPILOT_CONTAINER_NAME:-layerpilot}-worker
    init: true
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      layerpilot:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      LAYERPILOT_DB_PATH: /data/layerpilot.db.json
      LAYERPILOT_DB_ADAPTER: ${LAYERPILOT_DB_ADAPTER:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmflow}:${POSTGRES_PASSWORD:-change-this-database-password}@postgres:5432/${POSTGRES_DB:-farmflow}
      LAYERPILOT_POSTGRES_SCHEMA: ${LAYERPILOT_POSTGRES_SCHEMA:-public}
      LAYERPILOT_STORAGE_DIR: /data/storage
      LAYERPILOT_WORKER_ID: ${LAYERPILOT_WORKER_ID:-layerpilot-worker}
      LAYERPILOT_WORKER_TELEMETRY: ${LAYERPILOT_WORKER_TELEMETRY:-true}
      LAYERPILOT_WORKER_BRIDGE_POLLING: ${LAYERPILOT_WORKER_BRIDGE_POLLING:-true}
      LAYERPILOT_WORKER_TELEMETRY_INTERVAL_MS: ${LAYERPILOT_WORKER_TELEMETRY_INTERVAL_MS:-5000}
      LAYERPILOT_WORKER_BRIDGE_POLL_INTERVAL_MS: ${LAYERPILOT_WORKER_BRIDGE_POLL_INTERVAL_MS:-10000}
      LAYERPILOT_API_INTERNAL_URL: http://layerpilot:8797
      LAYERPILOT_WORKER_TOKEN: ${LAYERPILOT_WORKER_TOKEN:-change-this-worker-token}
      LAYERPILOT_MQTT_URL: ${LAYERPILOT_MQTT_URL:-}
      LAYERPILOT_MQTT_TOPIC_PREFIX: ${LAYERPILOT_MQTT_TOPIC_PREFIX:-layerpilot}
      LAYERPILOT_MQTT_USERNAME: ${LAYERPILOT_MQTT_USERNAME:-}
      LAYERPILOT_MQTT_PASSWORD: ${LAYERPILOT_MQTT_PASSWORD:-}
      LAYERPILOT_MQTT_QOS: ${LAYERPILOT_MQTT_QOS:-0}
      LAYERPILOT_MQTT_RETAIN: ${LAYERPILOT_MQTT_RETAIN:-false}
    volumes:
      - layerpilot-data:/data

  orca-worker:
    build:
      context: .
      dockerfile: deploy/orcaslicer/Dockerfile
      args:
        ORCA_SLICER_VERSION: ${ORCA_SLICER_VERSION:-2.4.2}
    image: layerpilot-orca:${ORCA_SLICER_VERSION:-2.4.2}
    container_name: ${LAYERPILOT_CONTAINER_NAME:-layerpilot}-orca
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      layerpilot:
        condition: service_healthy
    environment:
      LAYERPILOT_API_INTERNAL_URL: http://layerpilot:8797
      LAYERPILOT_WORKER_TOKEN: ${LAYERPILOT_WORKER_TOKEN:-change-this-worker-token}
      ORCA_WORKER_ID: ${ORCA_WORKER_ID:-layerpilot-orca}
      ORCA_SLICER_CMD: /usr/local/bin/orca-slicer
      ORCA_SLICER_VERSION: ${ORCA_SLICER_VERSION:-2.4.2}
      ORCA_SLICER_SETTINGS_PATH: ${ORCA_SLICER_SETTINGS_PATH:-}
      ORCA_SLICER_FILAMENT_PATH: ${ORCA_SLICER_FILAMENT_PATH:-}
      ORCA_WORKER_INTERVAL_MS: ${ORCA_WORKER_INTERVAL_MS:-3000}
      ORCA_SLICER_TIMEOUT_MS: ${ORCA_SLICER_TIMEOUT_MS:-1200000}
    volumes:
      - ./deploy/orcaslicer/profiles:/profiles:ro

volumes:
  layerpilot-data:
  layerpilot-postgres:
