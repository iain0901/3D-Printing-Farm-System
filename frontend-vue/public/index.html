<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <link href="<%= BASE_URL %>favicon.ico" rel="icon" />
    <link rel="manifest" href="<%= BASE_URL %>manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta content="3DRFM 三點成型｜FDM 3D 列印代印、建模與小量製造服務，上傳模型即時估價" name="description" />
    <meta content="<%= VUE_APP_AUTHOR %>" name="author" />
    <!-- Open Graph / Twitter：og:url 與 og:image 部署時換成正式網域與絕對圖片網址 -->
    <meta content="website" property="og:type" />
    <meta content="<%= VUE_APP_TITLE %>" property="og:site_name" />
    <meta content="<%= VUE_APP_TITLE %>" property="og:title" />
    <meta content="FDM 3D 列印代印、建模與小量製造服務，上傳模型即時估價，全程線上追蹤。" property="og:description" />
    <meta content="zh_TW" property="og:locale" />
    <meta content="summary" name="twitter:card" />
    <meta content="<%= VUE_APP_TITLE %>" name="twitter:title" />
    <meta content="FDM 3D 列印代印、建模與小量製造服務，上傳模型即時估價。" name="twitter:description" />
    <link href="<%= BASE_URL %>static/css/loading.css" rel="stylesheet" />
    <title><%= VUE_APP_TITLE %></title>
  </head>
  <body>
    <div id="vue-admin-better">
      <div class="first-loading-wrp">
        <div class="loading-wrp">
          <span class="dot dot-spin">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </span>
        </div>
        <h1><%= VUE_APP_TITLE %></h1>
      </div>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("<%= BASE_URL %>sw.js"));
      }
    </script>
  </body>
</html>
